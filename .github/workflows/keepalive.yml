# Free Supabase projects pause after 7 days of inactivity. Delete this file when on Pro.
# Repo secrets: SUPABASE_URL (base URL, no /rest/v1/), SUPABASE_PUBLISHABLE_KEY
name: supabase-keepalive
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through the Data API
        # A real table query reaches Postgres (RLS returns [] for the anonymous key),
        # which counts as project activity.
        run: |
          # Tolerate a pasted Data API URL: keep only scheme + host.
          BASE=$(printf "%s" "$SUPABASE_URL" | sed -E "s#^(https?://[^/]+).*#\1#")
          curl -fsS "$BASE/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" -o /dev/null
          echo "Supabase answered."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
